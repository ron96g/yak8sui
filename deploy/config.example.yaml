# yaml-language-server: $schema=../config/config.schema.json
server:
  address: ":8080"
  publicURL: "https://yak8sui.example.com"
  webDirectory: "/app/frontend"
  sessionTTL: "8h"
  cookieSecure: true
identity:
  # WARNING: mode: allowAll disables authentication and grants every visitor
  # every configured tenant action. Omit the OIDC fields only in that mode.
  mode: oidc
  issuerURL: "https://identity.example.com"
  clientID: "yak8sui"
  clientSecret: "replace-in-local-secret-file"
  redirectURL: "https://yak8sui.example.com/auth/callback"
  groupsClaim: "groups"
observation:
  databasePath: "/var/lib/yak8sui/resources.db"
  # No kubeconfig: use the pod's ServiceAccount.
  groups:
    - group: cert-manager.io
      include: [certificates, certificaterequests, issuers, clusterissuers]
  relationships: []
tenants:
  - id: platform
    name: Platform
    groups: [yak8sui-platform-admins]
    # Optional roles. Also add update/delete to the matching ClusterRole rules.
    # supervisorGroups: [yak8sui-platform-supervisors]
    # adminGroups: [yak8sui-platform-admins]
    labelSelector: "yak8sui.io/tenant=platform"
